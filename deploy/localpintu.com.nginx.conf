# Include this inside the existing TLS `server` block for localpintu.com.
root /var/www/localpintu/frontend/dist;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
